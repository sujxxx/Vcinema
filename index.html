    <!-- Fullscreen Theater Mode Overlay Container -->

    <!-- Notification Toast -->
    <div id="toastNotification" class="fixed bottom-5 right-4 left-4 sm:left-auto sm:right-6 z-50 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300">

        <span id="toastText" class="text-sm font-medium">Notification message</span>

    <footer id="mainFooter" class="border-t border-slate-800/80 py-8 text-center text-xs text-slate-500 bg-slate-900/30 px-4 transition-all duration-300">

    <script>
        let itemsData = [];
        let liveChannels = [];
        let currentLiveChannelIndex = 0;
        let isTheaterMode = false;
        let isMultiStreamMode = false;

        // MultiStream Config
        let activeMultiLayout = '2'; // '2', '3', '4', '6'
        let multiStreamSlots = {};   // { slotIndex: channelId }

        let performersMap = {};
        let favorites = JSON.parse(localStorage.getItem('vxn_favorites') || '[]');
        let currentTab = 'home';
        let selectedPerformerFilter = null;
        let studioSearchQuery = '';
        let perfSearchQuery = '';
        let liveSearchQuery = '';
        let searchTimeout = null;
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/sujxxx/vv/refs/heads/main/thumbs';
        const EMBED_TXT_URL = 'embed.txt';

        const studioAccents = {
            home: { heroText: 'Welcome!', badgeBg: 'bg-rose-500/10 text-rose-400 border-rose-500/30', selection: 'selection:bg-rose-600', textClass: 'text-rose-500' },
            live: { heroText: '🔴 Live Broadcast Streams & MultiStream Hub', badgeBg: 'bg-red-500/10 text-red-400 border-red-500/30', selection: 'selection:bg-red-600', textClass: 'text-red-500' },
            lucky: { heroText: '🎲 Feeling Lucky - Random Selections', badgeBg: 'bg-amber-500/10 text-amber-400 border-amber-500/30', selection: 'selection:bg-amber-600', textClass: 'text-amber-500' },
            vixen: { heroText: 'Vixen Studio Collection', badgeBg: 'bg-pink-500/10 text-pink-400 border-pink-500/30', selection: 'selection:bg-pink-600', textClass: 'text-pink-500' },
            tushy: { heroText: 'Tushy Studio Collection', badgeBg: 'bg-amber-500/10 text-amber-400 border-amber-500/30', selection: 'selection:bg-amber-600', textClass: 'text-amber-500' },
            tushyraw: { heroText: 'TushyRaw Studio Collection', badgeBg: 'bg-orange-500/10 text-orange-400 border-orange-500/30', selection: 'selection:bg-orange-600', textClass: 'text-orange-500' },
            blacked: { heroText: 'Blacked Studio Collection', badgeBg: 'bg-purple-500/10 text-purple-400 border-purple-500/30', selection: 'selection:bg-purple-600', textClass: 'text-purple-500' },
            blackedraw: { heroText: 'BlackedRaw Studio Collection', badgeBg: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30', selection: 'selection:bg-indigo-600', textClass: 'text-indigo-500' },
            performers: { heroText: 'Performers Directory & Granular Controls', badgeBg: 'bg-rose-500/10 text-rose-400 border-rose-500/30', selection: 'selection:bg-rose-600', textClass: 'text-rose-500' },
            watchlist: { heroText: 'My Saved Watchlist', badgeBg: 'bg-rose-500/10 text-rose-400 border-rose-500/30', selection: 'selection:bg-rose-600', textClass: 'text-rose-500' }
        };

        window.onload = async function() {
            await Promise.all([fetchRemoteData(), fetchEmbedData()]);
            updateWatchlistCount();
            populateAdvancedPerformersDropdown();
            renderActiveTab();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isTheaterMode) {
                    exitTheaterMode();
                }
            });
        };

        async function fetchRemoteData() {
            try {
                const response = await fetch(GITHUB_RAW_URL);
                if (!response.ok) throw new Error('Network response failed');
                const rawText = await response.text();
                parseAndLoadText(rawText);
            } catch (error) {
                console.error("Failed to load remote data:", error);
                showToast("Failed to connect to data source.");
            }
        }

        async function fetchEmbedData() {
            try {
                const response = await fetch(EMBED_TXT_URL);
                if (!response.ok) throw new Error('Failed to load embed.txt');
                const embedText = await response.text();
                parseEmbedText(embedText);
            } catch (error) {
                console.warn("Could not fetch embed.txt directly, using fallback channels.", error);
                const fallbackEmbeds = `
                <iframe src="https://thedaddy.li/cast/stream-503.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-506.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-507.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-508.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-509.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-520.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-518.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-501.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                <iframe src="https://thedaddy.li/cast/stream-505.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
                `;
                parseEmbedText(fallbackEmbeds);
            }
        }

        function parseEmbedText(rawText) {
            liveChannels = [];
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            lines.forEach((line, idx) => {
                let srcUrl = '';
                const match = line.match(/src=["']([^"']+)["']/i);
                if (match && match[1]) {
                    srcUrl = match[1];
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    srcUrl = line;
                }

                if (srcUrl) {
                    let channelNum = 'Live Channel ' + (idx + 1);
                    const streamMatch = srcUrl.match(/stream-(\d+)/i);
                    if (streamMatch) {
                        channelNum = `Stream #${streamMatch[1]}`;
                    }
                    liveChannels.push({
                        id: idx,
                        name: channelNum,
                        url: srcUrl,
                        rawTag: line
                    });
                }
            });

            // Pre-populate default MultiStream slots
            if (liveChannels.length >= 2) {
                multiStreamSlots = { 0: 0, 1: 1 };
            }
        }

        function parseAndLoadText(rawText) {
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            itemsData = [];
            performersMap = {};

            for (let line of lines) {
                let urlMatches = line.match(/https?:\/\/[^\s]+/g);
                let link = '';
                let imglink = '';
                let textPart = line;

                if (urlMatches && urlMatches.length > 0) {
                    link = urlMatches[0];
                    if (urlMatches.length > 1) {
                        imglink = urlMatches[1];
                    }
                    for (let u of urlMatches) {
                        textPart = textPart.replace(u, '');
                    }
                }

                textPart = textPart.replace(/[-–—]\s*$/, '').trim();

                if (textPart.length > 0) {
                    let filename = textPart;
                    let lowerName = filename.toLowerCase();

                    let studio = 'other';
                    if (lowerName.includes('vixen')) studio = 'vixen';
                    else if (lowerName.includes('tushyraw') || lowerName.includes('tushy raw')) studio = 'tushyraw';
                    else if (lowerName.includes('tushy')) studio = 'tushy';
                    else if (lowerName.includes('blackedraw') || lowerName.includes('blacked raw')) studio = 'blackedraw';
                    else if (lowerName.includes('blacked')) studio = 'blacked';

                    let dateMatch = filename.match(/\b(20\d{2}[./]\d{2}[./]\d{2}|\d{2}[./]\d{2}[./]20\d{2})\b/);
                    let dateStr = dateMatch ? dateMatch[0].replace(/\./g, '-') : '2000-01-01';

                    let performers = [];
                    let sceneTitle = filename;

                    let cleanMiddle = filename.replace(/^(Vixen|TushyRaw|Tushy|BlackedRaw|Blacked)\s+(\d{4}[./]\d{2}[./]\d{2}|\d{2}[./]\d{2}[./]20\d{4})\s*/i, '');
                    if (cleanMiddle.includes(' - ')) {
                        let segments = cleanMiddle.split(' - ');
                        let rawPerformers = segments[0];
                        if (rawPerformers) {
                            performers = rawPerformers.split(',').map(p => p.trim()).filter(p => p.length > 0);
                        }
                        if (segments.length > 1) {
                            sceneTitle = segments.slice(1).join(' - ').trim();
                        }
                    } else if (cleanMiddle.includes(' — ')) {
                        let segments = cleanMiddle.split(' — ');
                        let rawPerformers = segments[0];
                        if (rawPerformers) {
                            performers = rawPerformers.split(',').map(p => p.trim()).filter(p => p.length > 0);
                        }
                        if (segments.length > 1) {
                            sceneTitle = segments.slice(1).join(' — ').trim();
                        }
                    } else if (cleanMiddle.includes(' ')) {
                        let firstSpace = cleanMiddle.indexOf(' ');
                        if (firstSpace !== -1) {
                            let rawPerformers = cleanMiddle.substring(0, firstSpace);
                            performers = rawPerformers.split(',').map(p => p.trim()).filter(p => p.length > 0);
                            sceneTitle = cleanMiddle.substring(firstSpace + 1).trim();
                        }
                    }

                    let itemObj = { id: link, filename, sceneTitle, link, imglink, studio, dateStr, performers };
                    itemsData.push(itemObj);

                    performers.forEach(perf => {
                        if (!performersMap[perf]) performersMap[perf] = [];
                        performersMap[perf].push(itemObj);
                    });
                }
            }

        function getRandomSubarray(arr, size) {
            let shuffled = arr.slice(0), i = arr.length, min = Math.max(0, i - size), temp, index;
            while (i-- > min) {
                index = Math.floor((i + 1) * Math.random());
                temp = shuffled[index];
                shuffled[index] = shuffled[i];
                shuffled[i] = temp;
            }
            return shuffled.slice(min);
        }

                    if (searchQuery.length > 0) {
                        const fullText = (item.filename + " " + item.link).toLowerCase();
                        const terms = searchQuery.split(/\s+/);
                        return terms.every(t => fullText.includes(t));
                    }
                    return true;
                });

            }));

            if (perfSearchQuery.length > 0) {
                sortedPerformers = sortedPerformers.filter(p => p.name.toLowerCase().includes(perfSearchQuery));
            }

            if (perfSort === 'count_desc') {
                sortedPerformers.sort((a, b) => b.count - a.count);
            } else if (perfSort === 'count_asc') {
                sortedPerformers.sort((a, b) => a.count - b.count);
            } else if (perfSort === 'az') {
                sortedPerformers.sort((a, b) => a.name.localeCompare(b.name));
            }

            if (selectedPerformerFilter) {
                let modelScenes = performersMap[selectedPerformerFilter] || [];
                modelScenes = sortItemsList(modelScenes, 'date_desc');

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                            <h3 class="text-base sm:text-xl font-bold text-white flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
                                <button onclick="selectedPerformerFilter=null;renderActiveTab();" class="accent-text hover:underline text-xs sm:text-sm text-left"><i class="fa-solid fa-arrow-left"></i> Back to Directory</button>
                                <span class="line-clamp-1">Performer: ${selectedPerformerFilter} <span class="text-xs font-normal text-slate-400">(${modelScenes.length} scenes)</span></span>
                            </h3>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
                            ${modelScenes.map(item => renderCard(item)).join('')}
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 pb-4 gap-3">
                        <h3 class="text-lg sm:text-xl font-bold text-white"><i class="fa-solid fa-users accent-icon"></i> Performers Directory <span class="text-xs sm:text-sm font-normal text-slate-400">(${sortedPerformers.length})</span></h3>

                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <input type="text" id="perfSearchInput" oninput="perfSearchQuery = this.value; renderActiveTab();" placeholder="Search model..." value="${escapeHtml(perfSearchQuery)}"
                                class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none w-full sm:w-40">
                            <select id="perfSortSelect" onchange="renderActiveTab()" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none">
                                <option value="count_desc" ${perfSort==='count_desc'?'selected':''}>Most</option>
                                <option value="count_asc" ${perfSort==='count_asc'?'selected':''}>Least</option>
                                <option value="az" ${perfSort==='az'?'selected':''}>A-Z</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
                        ${sortedPerformers.map(p => `
                            <div onclick="selectPerformer('${escapeJs(p.name)}')" class="bg-cardbg border border-slate-800 hover:border-rose-600/60 p-3 sm:p-4 rounded-2xl cursor-pointer transition flex flex-col items-center text-center space-y-2 group shadow-lg">
                                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-800 group-hover:bg-rose-600/20 accent-text flex items-center justify-center font-bold text-base sm:text-lg transition">
                                    ${p.name.charAt(0).toUpperCase()}
                                </div>
                                <h4 class="text-xs font-semibold text-slate-200 group-hover:text-white line-clamp-1">${escapeHtml(p.name)}</h4>
                                <span class="text-[10px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-full border border-slate-800">${p.count} scenes</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            let perfInputEl = document.getElementById('perfSearchInput');
            if (perfInputEl) {
                perfInputEl.focus();
                perfInputEl.setSelectionRange(perfInputEl.value.length, perfInputEl.value.length);
            }
        }

        function sortItemsList(list, sortOrder) {
            return list.sort((a, b) => {
                if (sortOrder === 'date_desc') {
                    return new Date(b.dateStr) - new Date(a.dateStr);
                } else if (sortOrder === 'date_asc') {
                    return new Date(a.dateStr) - new Date(b.dateStr);
                } else if (sortOrder === 'title_asc') {
                    return a.sceneTitle.localeCompare(b.sceneTitle);
                }
                return 0;
            });
        }

        function renderRow(title, list, studioKey = '', tabKey = '') {
            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base sm:text-lg font-bold text-white tracking-wide flex items-center gap-2">
                            <span class="w-1.5 h-4 sm:h-5 bg-rose-600 rounded-full"></span> ${title}
                        </h3>
                        ${tabKey ? `<button onclick="switchTab('${tabKey}')" class="text-xs accent-text hover:underline font-semibold transition">See All</button>` : ''}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                        ${list.map(item => renderCard(item)).join('')}
                    </div>
                </div>
            `;
        }

        function renderCard(item) {
            const isFav = favorites.includes(item.link);
            const studioBadgeInfo = studioAccents[item.studio] || studioAccents.home;

            let performersHtml = 'Solo / Unknown';
            if (item.performers.length > 0) {
                performersHtml = item.performers.map(p =>
                    `<span onclick="selectPerformer('${escapeJs(p)}')" class="hover:underline cursor-pointer text-rose-400/90 hover:text-rose-300 transition">${escapeHtml(p)}</span>`
                ).join(', ');
            }

            return `
                <div class="bg-cardbg border border-slate-800/80 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition duration-300 flex flex-col justify-between group">
                    <div class="p-4 sm:p-5 space-y-2.5 sm:space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded-full border tracking-wider ${studioBadgeInfo.badgeBg}">
                                ${item.studio.toUpperCase()}
                            </span>
                            <button onclick="toggleFavorite('${escapeJs(item.link)}')" class="text-slate-400 hover:text-rose-500 transition text-base p-1">
                                <i class="${isFav ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart'}"></i>
                            </button>
                        </div>

                        <div class="space-y-1 pt-0.5">
                            <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-rose-400 transition line-clamp-2 leading-snug" title="${escapeHtml(item.sceneTitle)}">
                                ${escapeHtml(item.sceneTitle)}
                            </h4>
                            <p class="text-[11px] sm:text-xs text-slate-400 font-medium">
                                <span class="text-slate-300">${escapeHtml(item.dateStr)}</span> &bull;
                                <span>${performersHtml}</span>
                            </p>
                        </div>
                    </div>
                    <div class="p-3 sm:p-4 pt-0 flex items-center gap-2">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer"
                            class="flex-1 py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition flex items-center justify-center gap-2 text-xs font-semibold" title="Original Link">
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> Open
                        </a>
                        ${item.imglink ? `
                        <a href="${item.imglink}" target="_blank" rel="noopener noreferrer"
                            class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl border border-slate-700 transition flex items-center justify-center gap-2 text-xs font-semibold" title="Image Gallery">
                            <i class="fa-solid fa-images text-xs"></i> Gallery
                        </a>` : ''}
                    </div>
                </div>
            `;
        }

        function toggleFavorite(link) {
            if (favorites.includes(link)) {
                favorites = favorites.filter(l => l !== link);
                showToast("Removed from Watchlist");
            } else {
                favorites.push(link);
                showToast("Added to Watchlist!");
            }
            localStorage.setItem('vxn_favorites', JSON.stringify(favorites));
            updateWatchlistCount();
            renderActiveTab();
        }

        function updateWatchlistCount() {
            document.getElementById('watchlistCount').innerText = favorites.length;
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeJs(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
